name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  premium-revision:
    name: Resolve Premium revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout heelonvault-premium
        uses: actions/checkout@v7.0.1
        with:
          repository: ppaperso/heelonvault-premium
          ref: main
          ssh-key: ${{ secrets.PREMIUM_SSH_KEY }}
          persist-credentials: false
          path: heelonvault-premium

      - name: Record revision shared by all checks
        id: revision
        working-directory: heelonvault-premium
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    name: ${{ matrix.suite }}
    needs: premium-revision
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [quality, tests, premium, msrv, api]
    defaults:
      run:
        working-directory: heelonvault-core
    steps:
      - name: Checkout heelonvault-core
        uses: actions/checkout@v7.0.1
        with:
          path: heelonvault-core
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout heelonvault-premium
        uses: actions/checkout@v7.0.1
        with:
          repository: ppaperso/heelonvault-premium
          ref: ${{ needs.premium-revision.outputs.sha }}
          ssh-key: ${{ secrets.PREMIUM_SSH_KEY }}
          persist-credentials: false
          path: heelonvault-premium

      - name: Setup Rust toolchain
        run: |
          set -euo pipefail
          rustup show
          cargo --version

      # Only public crates.io downloads: never cache Premium sources or build outputs.
      - name: Cache public Cargo downloads
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache/index.crates.io-*
            ~/.cargo/registry/index/index.crates.io-*
            ~/.cargo/registry/src/index.crates.io-*
          key: ${{ runner.os }}-cargo-public-v1-${{ matrix.suite }}-${{ hashFiles('heelonvault-core/rust-toolchain.toml', 'heelonvault-core/Cargo.lock', 'heelonvault-premium/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-public-v1-${{ matrix.suite }}-

      - name: cargo fmt --check
        if: matrix.suite == 'quality'
        run: cargo fmt -p heelonvault-core -p heelonvault-app -p heelonvault-url-check -p sqlx -- --check

      - name: Check user-guide images
        if: matrix.suite == 'quality'
        run: bash scripts/check-user-guide-assets.sh

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgraphene-1.0-dev \
            libharfbuzz-dev \
            pkg-config \
            xvfb \
            xauth \
            libsqlite3-dev

      - name: cargo clippy
        if: matrix.suite == 'quality'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # Same lints as the `cargo clippy-secure` alias (.cargo/config.toml), spelled out so that
      # `--locked` reaches cargo: test code is held to the no-unwrap/expect/panic rule too.
      - name: cargo clippy-secure
        if: matrix.suite == 'quality'
        run: >-
          cargo clippy --locked --workspace --all-targets --all-features --
          -D clippy::unwrap_used -D clippy::expect_used -D clippy::disallowed_methods
          -D clippy::panic -D clippy::todo -D clippy::unimplemented

      - name: cargo check --workspace
        if: matrix.suite == 'quality'
        run: cargo check --workspace --all-features --locked

      - name: Check Community assembly
        if: matrix.suite == 'quality'
        run: cargo check --locked -p heelonvault-app --no-default-features

      - name: cargo test --workspace
        if: matrix.suite == 'tests'
        run: cargo test --workspace --all-features --locked

      - name: Native GTK smoke tests
        if: matrix.suite == 'tests'
        env:
          GSK_RENDERER: cairo
          GDK_BACKEND: x11
        run: >-
          dbus-run-session -- xvfb-run --auto-servernum
          cargo test --locked --workspace --all-features
          native_ -- --ignored --nocapture

      - name: Check standalone Premium
        if: matrix.suite == 'premium'
        working-directory: heelonvault-premium
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo check --locked --all-features
          cargo test --locked --all-targets --all-features

      - name: Check minimum supported Rust
        if: matrix.suite == 'msrv'
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          cargo +1.98.0 check --locked --workspace --all-targets --all-features

      - name: Check standalone Premium minimum supported Rust
        if: matrix.suite == 'msrv'
        working-directory: heelonvault-premium
        run: cargo +1.98.0 check --locked --all-targets --all-features

      - name: Install cargo-semver-checks
        if: matrix.suite == 'api'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.51.0

      - name: cargo semver-checks (heelonvault-core)
        if: matrix.suite == 'api'
        run: cargo semver-checks -p heelonvault-core

      - name: cargo publish --dry-run (heelonvault-core)
        if: matrix.suite == 'api'
        run: cargo publish --dry-run -p heelonvault-core --locked

  check:
    name: check, clippy, fmt, test
    if: always()
    needs: [premium-revision, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation suite to succeed
        env:
          PREMIUM_RESULT: ${{ needs.premium-revision.result }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          if [ "$PREMIUM_RESULT" != success ] || [ "$VALIDATION_RESULT" != success ]; then
            echo "::error::CI incomplete or unsuccessful: Premium=$PREMIUM_RESULT, validation=$VALIDATION_RESULT"
            exit 1
          fi
