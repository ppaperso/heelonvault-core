name: supply-chain

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
  schedule:
    # Runs on default branch only — PREMIUM_SSH_KEY available via repo secrets.
    # Daily at 07:00 UTC — catches new advisories published overnight.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny supply-chain gate
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v6

      # ── 2. Checkout heelonvault-premium (sibling checkout) ──────────────────
      # heelonvault-app/Cargo.toml depends on heelonvault-premium via a plain
      # PATH dependency: `path = "../../../heelonvault-premium"` (i.e. a sibling
      # of this repo's checkout root, not a git dependency). There is no git/ssh
      # dependency anywhere in this workspace's Cargo.toml/Cargo.lock — the
      # [patch.'ssh://...'] entries in the root Cargo.toml target a URL nothing
      # actually depends on, they are inert. `cargo metadata` (which
      # cargo-deny-action runs under the hood) therefore just needs the
      # directory to physically exist at checkout time; it does not fetch it
      # over git itself. So we check it out explicitly here, as a real sibling
      # directory, using the deploy key for the private repo.
      - name: Checkout heelonvault-premium
        uses: actions/checkout@v6
        with:
          repository: ppaperso/heelonvault-premium
          ssh-key: ${{ secrets.PREMIUM_SSH_KEY }}
          path: ../heelonvault-premium

      # ── 3. cargo-deny check ────────────────────────────────────────────────
      # Checks: advisories (CVE/yanked), licenses, bans, sources
      # Pinned to exact version — a floating @v2 tag on a security gate
      # would be ironic. Update intentionally when new versions are available.
      #
      # No ssh-key/use-git-cli needed here: heelonvault-premium is already on
      # disk from step 2 above (plain path dependency), so cargo never needs
      # network/git access to resolve it.
      - name: Run cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2.0.20
        with:
            command: check
            arguments: --all-features
            log-level: warn
            manifest-path: Cargo.toml
