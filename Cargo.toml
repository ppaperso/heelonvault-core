[workspace]
members = [
    "crates/heelonvault-core",
    "crates/heelonvault-app",
    "crates/sqlx-shim",
    "crates/heelonvault-url-check",
]
resolver = "2"

[patch.crates-io]
# Force heelonvault-core (référencé depuis premium via crates.io) à pointer
# sur la copie locale du workspace, pour éviter la duplication de traits.
heelonvault-core = { path = "crates/heelonvault-core" }

# SQLite advisory remediation pending a published SQLx release.
# Owner: @ppaperso; remove by 2026-11-16 and before crates.io publication; #75.
sqlx = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-core = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-sqlite = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }

# Patch pour heelonvault-premium (dépôt local adjacent)
# Permet de builder le workspace sans avoir à cloner le repo premium séparément
# si on utilise --no-default-features (mode community)
[patch.'ssh://git@github.com/ppaperso/heelonvault-premium.git']
heelonvault-premium = { path = "../heelonvault-premium" }

[patch."git+ssh://git@github.com/ppaperso/heelonvault-premium.git?branch=main"]
heelonvault-premium = { path = "../heelonvault-premium" }

[workspace.dependencies]
# Outils de développement
cargo-deny = "0.20.2"
