[package]
name = "heelonvault-url-check"
version = "2.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["ppaperso <ppaperso@users.noreply.github.com>"]
license = "Apache-2.0"
description = "Optional, bounded HTTPS reachability check (DNS + TLS handshake only) for HeelonVault"
repository = "https://github.com/ppaperso/heelonvault-core"
publish = false

[lib]
name = "heelonvault_url_check"
path = "src/lib.rs"

[dependencies]
thiserror = "2.0"
tokio = { version = "1.53", default-features = false, features = ["net", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2.5"
webpki-roots = "1.0"

[dev-dependencies]
tokio = { version = "1.53", default-features = false, features = ["rt", "net", "time", "io-util"] }
