# Configuration de cargo-deny pour la sécurité de la supply-chain
# Documentation: https://embarkstudios.github.io/cargo-deny/
# Issues: #28, #40 - enforce supply-chain policy in CI

[advisories]
# Bloc toutes les vulnérabilités connues (CVE) — zéro tolérance
version = 2
yanked = "deny"
unmaintained = "all"

[licenses]
# Politique de licences : autoriser uniquement les licences permissives approuvées
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",              # option-ext
  "CDLA-Permissive-2.0",  # webpki-roots
]

# Unpublished crates (`publish = false`) are our own: heelonvault-premium is proprietary
# (LicenseRef-Heelonys-Proprietary) and deliberately outside the allow-list above.
[licenses.private]
ignore = true

[bans]
# Approche zero-debt : "deny" + skip explicites.
# Toute nouvelle duplicate non documentée fait échouer le build.
# Les exceptions ci-dessous ont été revues et acceptées — mettre à jour
# lorsque les crates upstream alignent leurs séries de versions.
multiple-versions = "deny"
skip = [
  # reqwest/sqlx-core (base64 0.22) vs heelonvault-core/reqwest (base64 0.23)
  { name = "base64",            reason = "sqlx-core 0.9 → base64 0.22 ; reqwest/heelonvault-core → base64 0.23" },
  # fluent-templates et sqlx utilisent des séries flume incompatibles
  { name = "flume",             reason = "fluent-templates → 0.11, sqlx → 0.12 ; migration upstream en attente" },
  # ring utilise encore 0.2 ; rand/uuid/tempfile utilisent 0.4
  { name = "getrandom",         reason = "ring sur 0.2 ; rand/uuid/tempfile sur 0.4 — séries incompatibles" },
  # hashbrown : split de version dans l'écosystème indexmap/hashbrown
  { name = "hashbrown",         reason = "split de version dans l'écosystème indexmap/hashbrown" },
  # image/png → miniz_oxide 0.8 (direct) ; png → flate2 → miniz_oxide 0.9
  { name = "miniz_oxide",       reason = "png → miniz_oxide 0.8 (direct) ; png → flate2 → miniz_oxide 0.9" },
  # le shim local et la crate registry sont deux packages distincts
  { name = "sqlx",              reason = "shim local sqlx et crate registry sqlx — sources distinctes" },
  # les proc-macros utilisent encore plusieurs séries syn incompatibles
  { name = "syn",               reason = "split de versions majeures syn entre les proc-macros upstream" },
  # gtk4-rs 0.11 (gdk4-sys) → system-deps 7 ; cairo/gio/glib/pango-sys 0.22 → system-deps 9
  { name = "system-deps",       reason = "gdk4-sys 0.11 → system-deps 7 ; cairo/gio/glib/pango-sys 0.22 → system-deps 9" },
  # windows-sys : split des bindings Windows SDK entre ring/rustls et les autres
  { name = "windows-sys",              reason = "ring/rustls sur une version Windows SDK ; reste de l'écosystème sur une autre" },
]

[sources]
# Premium est local. Seul le correctif SQLx officiel epingle est autorise.
# Owner: @ppaperso; retrait avant le 2026-11-16 et publication crates.io; #75.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
required-git-spec = "rev"
allow-git = ["https://github.com/launchbadge/sqlx"]
